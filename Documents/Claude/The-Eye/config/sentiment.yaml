# Sentiment classification config
# Cập nhật version và model_path sau mỗi lần train PhoBERT (Phase 2)

version: "rule_v2"
updated_at: "2026-05-31"

# Sau Phase 2, điền đường dẫn model vào đây để tự động dùng PhoBERT
model_path: null
# model_path: "models/phobert_v1.pth"

# Ngưỡng confidence để dùng PhoBERT (nếu thấp hơn → fallback sang rule)
phobert_confidence_threshold: 0.75

# ----------------------------------------------------------------
# Negation words — nếu xuất hiện trước keyword POS → huỷ/giảm điểm
# ----------------------------------------------------------------
negation:
  words:
    - "không"
    - "chưa"
    - "chẳng"
    - "chưa thể"
    - "không thể"
    - "khó"
    - "thiếu"
    - "vẫn chưa"
    - "chưa đạt"
    - "chưa đạt được"
    - "không đạt"
    - "chưa hoàn thành"
    - "chưa có"
    - "khó có thể"
    - "không có"

# ----------------------------------------------------------------
# Rule-based classification
# ----------------------------------------------------------------

positive:
  strong:   # Chắc chắn POS, weight 1.0
    - "lợi nhuận tăng"
    - "doanh thu tăng"
    - "kỷ lục doanh thu"
    - "kỷ lục lợi nhuận"
    - "lãi kỷ lục"
    - "lãi ròng tăng"
    - "tăng trưởng mạnh"
    - "tăng trưởng vượt bậc"
    - "ký kết hợp đồng"
    - "hợp tác chiến lược"
    - "mở rộng thị trường"
    - "vượt kế hoạch"
    - "vượt mục tiêu"
    - "vượt chỉ tiêu"
    - "hoàn thành kế hoạch"
    - "đạt kế hoạch"
    - "đột biến lợi nhuận"
    - "lợi nhuận đột biến"
    - "phát hành thành công"
    - "cổ tức cao"
    - "niêm yết thêm"
    - "IPO thành công"
    - "trúng thầu"
    - "nhận giải thưởng"
    - "xếp hạng tăng"
    - "lên sàn"
    - "thặng dư vốn"
    - "kết quả ấn tượng"
    - "tăng mạnh"
    - "xuất khẩu tăng"
    - "tăng vốn thành công"
    - "lợi nhuận khả quan"
    - "kết quả tích cực"
    - "đạt lợi nhuận"
    - "kinh doanh có lãi"
    - "lãi đậm"
  weak:     # Có thể POS, weight 0.4
    - "tăng vốn"
    - "phát hành cổ phiếu"
    - "M&A"
    - "mua lại"
    - "đầu tư mở rộng"
    - "triển vọng tích cực"
    - "kế hoạch tăng trưởng"
    - "triển vọng"
    - "kỳ vọng tích cực"
    - "tín hiệu tốt"
    - "phục hồi"
    - "tăng nhẹ"
    - "lạc quan"
    - "tích cực"
    - "khởi sắc"
    - "cải thiện"
    - "tăng trưởng"
    - "tốt hơn kỳ vọng"

negative:
  strong:   # Chắc chắn NEG, weight 1.0
    - "thua lỗ"
    - "lỗ ròng"
    - "lỗ nặng"
    - "lỗ lớn"
    - "lợi nhuận giảm"
    - "doanh thu giảm"
    - "sụt giảm mạnh"
    - "khởi tố"
    - "bị phạt"
    - "điều tra"
    - "vi phạm"
    - "hủy niêm yết"
    - "đình chỉ giao dịch"
    - "đình chỉ hoạt động"
    - "nợ xấu"
    - "nợ quá hạn"
    - "mất khả năng thanh toán"
    - "phá sản"
    - "giải thể"
    - "thu hồi giấy phép"
    - "bị thu hồi"
    - "bị kiện"
    - "thua kiện"
    - "tranh chấp pháp lý"
    - "cắt giảm nhân sự"
    - "đóng cửa nhà máy"
    - "thu hồi sản phẩm"
    - "âm vốn"
    - "bị cưỡng chế"
    - "hủy hợp đồng"
    - "thanh lý"
    - "kiểm toán từ chối"
    - "ý kiến kiểm toán ngoại trừ"
    - "chậm nộp thuế"
    - "trốn thuế"
    - "gian lận"
    - "tăng trưởng âm"
  weak:     # Có thể NEG, weight 0.4
    - "giảm vốn"
    - "thoái vốn"
    - "chậm tiến độ"
    - "dưới kế hoạch"
    - "cảnh báo"
    - "rủi ro"
    - "thách thức"
    - "áp lực"
    - "sụt giảm"
    - "giảm sút"
    - "kém khả quan"
    - "dưới kỳ vọng"
    - "chưa đạt kế hoạch"
    - "điều chỉnh giảm"
    - "lợi nhuận thấp"
    - "khó khăn"

neutral:
  indicators:   # Tin thông báo/hành chính → NEU
    - "họp ĐHCĐ"
    - "Đại hội đồng cổ đông"
    - "thông báo giao dịch"
    - "bổ nhiệm"
    - "miễn nhiệm"
    - "thay đổi nhân sự"
    - "công bố báo cáo tài chính"
    - "kết quả kinh doanh quý"
    - "chia cổ tức"
    - "chốt danh sách"
    - "thay đổi điều lệ"
    - "phát hành quyền mua"
    - "thông báo"
    - "công bố"
    - "họp hội đồng quản trị"
    - "phê duyệt phương án"

# ----------------------------------------------------------------
# Training categories cho Phase 2
# ----------------------------------------------------------------
training_categories:
  - id: chung_khoan
    name: "Chứng khoán"
    description: "Tin giao dịch, biến động giá, thị trường"

  - id: bao_cao_tai_chinh
    name: "Báo cáo tài chính"
    description: "KQKD, BCTC, doanh thu, lợi nhuận"

  - id: hoat_dong_su_kien
    name: "Hoạt động & Sự kiện"
    description: "Ký kết, ra mắt, khai trương, hội nghị"

  - id: nhan_su
    name: "Nhân sự"
    description: "Bổ nhiệm, miễn nhiệm, thay đổi lãnh đạo"

  - id: phap_ly
    name: "Pháp lý & Quản trị"
    description: "Điều tra, khởi tố, vi phạm, phán quyết"

  - id: chien_luoc
    name: "Chiến lược & Đầu tư"
    description: "M&A, mở rộng, IPO, thoái vốn, liên kết"

  - id: san_xuat_kinh_doanh
    name: "Sản xuất & Kinh doanh"
    description: "Hoạt động vận hành, đơn hàng, hợp đồng"

  - id: vi_mo
    name: "Vĩ mô & Ngành"
    description: "Tin ngành, chính sách ảnh hưởng gián tiếp"
