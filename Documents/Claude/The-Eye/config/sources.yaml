  # === Google News RSS — search theo từng doanh nghiệp ===
  # URL được inject tự động từ companies.yaml lúc runtime
  - id: google_news_template
    name: "Google News - {company_name}"
    url: "https://news.google.com/rss/search?q={query}&hl=vi&gl=VN&ceid=VN:vi"
    type: google_rss
    priority: high
    active: true
    poll_interval_sec: 600    # 10 phút (Google rate limit)
    categories: [google_news]
