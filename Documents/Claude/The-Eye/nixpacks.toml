[phases.setup]
nixPkgs = ["python311", "gcc", "openssl", "pkg-config", "rustc", "cargo"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip setuptools wheel",
  ". /opt/venv/bin/activate && pip install maturin",
  ". /opt/venv/bin/activate && pip install --no-build-isolation -r requirements.txt"
]
paths = ["/opt/venv/bin"]

[start]
cmd = "python main.py"
